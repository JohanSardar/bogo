name: Install Lean
description: Installs elan and the Lean toolchain pinned in lean/lean-toolchain, cached by that pin.
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.elan
        key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain') }}
    - shell: bash
      run: |
        if [ ! -x "$HOME/.elan/bin/elan" ]; then
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh \
            | sh -s -- -y --default-toolchain none --no-modify-path
        fi
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        cd lean && "$HOME/.elan/bin/lean" --version
