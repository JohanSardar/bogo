name: Idea or request
description: Suggest something BOGO should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and the agent or tools involved, not only the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
  - type: textarea
    id: safety
    attributes:
      label: Does it change what BOGO protects?
      description: If it could let a call run without an exact approval, say how you'd keep the promise in SECURITY.md.
