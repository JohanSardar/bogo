# Weekly update PRs for Rust crates and GitHub Actions. CI runs on each one.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The gate depends on rmcp internals; it is pinned exactly and upgraded by hand
      # (Cargo.toml, ARCHITECTURE §9).
      - dependency-name: rmcp
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
