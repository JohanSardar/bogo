[package]
name = "bogo-verify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Not `[lints] workspace = true`: the workspace forbids `unsafe`, and `bogo_rs_verify` is the one
# `extern "C"` export the Lean core calls. Every other item is checked as `unsafe`-free.
[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
p256 = { version = "0.14", features = ["ecdsa"] }
ed25519-dalek = { version = "2", optional = true }

[features]
default = []
test-approvers = ["dep:ed25519-dalek"]
